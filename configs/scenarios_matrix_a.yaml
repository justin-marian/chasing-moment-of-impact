# Scenario Matrix A: Light load for quick validation and baseline correctness.

# Identification
id: A
seed: 42 # Fixed seed for deterministic reproducibility.

# Shape counts (total: 850 bodies)
spheres_i: 100
cubes_i: 250
cylinders_i: 250
cones_i: 250

# Geometry and world bounds
radius_m: 0.35
boxHalfExtentX_m: 20
boxHalfExtentY_m: 15
boxHalfExtentZ_m: 20

# Physics and timing
dt_s: 0.008333333333333333 # 120 Hz fixed time step.
gravity_mps2: 9.81
maxInitialSpeed_mps: 5

# Broad-phase and CCD
cellSize_m: 1.6
enableCcd: true
